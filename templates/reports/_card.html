{% load static %}
<article class="group flex flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm transition hover:border-emerald-300 hover:shadow-md dark:border-gray-700 dark:bg-gray-800 dark:hover:border-emerald-500/40">
    <a href="{{ report.open_url }}" class="flex flex-1 items-start gap-4 p-5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-emerald-500">
        <span class="shrink-0 rounded-xl p-2.5
            {% if report.accent == 'emerald' %}bg-emerald-50 text-emerald-600 dark:bg-emerald-500/10 dark:text-emerald-400
            {% elif report.accent == 'red' %}bg-red-50 text-red-600 dark:bg-red-500/10 dark:text-red-400
            {% elif report.accent == 'blue' %}bg-blue-50 text-blue-600 dark:bg-blue-500/10 dark:text-blue-400
            {% elif report.accent == 'amber' %}bg-amber-50 text-amber-600 dark:bg-amber-500/10 dark:text-amber-400
            {% elif report.accent == 'purple' %}bg-purple-50 text-purple-600 dark:bg-purple-500/10 dark:text-purple-400
            {% else %}bg-teal-50 text-teal-600 dark:bg-teal-500/10 dark:text-teal-400{% endif %}">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="{{ report.icon }}"></path></svg>
        </span>
        <span class="min-w-0 flex-1">
            <span class="flex items-start justify-between gap-3">
                <h2 class="text-base font-semibold leading-snug text-gray-800 dark:text-white">{{ report.title }}</h2>
                <span class="shrink-0 rounded-full bg-gray-100 px-2.5 py-1 text-[.62rem] font-semibold uppercase tracking-wider text-gray-500 dark:bg-gray-700 dark:text-gray-300">{{ report.period }}</span>
            </span>
            <p class="mt-1.5 text-sm text-gray-500 dark:text-gray-400">{{ report.description }}</p>
            <span class="mt-3 inline-flex items-center gap-1 text-xs font-semibold uppercase tracking-wider text-emerald-700 dark:text-emerald-400">
                Open report
                <svg class="h-3.5 w-3.5 transition-transform group-hover:translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </span>
        </span>
    </a>

    {# Three separate outputs, never one combined "Print / PDF" action. #}
    <div class="mt-auto grid grid-cols-3 divide-x divide-gray-200 border-t border-gray-200 dark:divide-gray-700 dark:border-gray-700">
        <a href="{{ report.print_url }}" target="_blank" rel="noopener"
           aria-label="Print the {{ report.title }}. Opens a print preview first."
           class="flex flex-col items-center gap-1 px-2 py-3 text-center transition-colors hover:bg-emerald-50/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-emerald-500 dark:hover:bg-emerald-500/10">
            <svg class="h-5 w-5 text-gray-500 transition-colors group-hover:text-emerald-600 dark:text-gray-400 dark:group-hover:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
            <span class="text-xs font-semibold text-gray-700 dark:text-gray-200">Print</span>
            <span class="text-[.62rem] text-gray-400 dark:text-gray-500">preview first</span>
        </a>
        <a href="{{ report.pdf_url }}"
           aria-label="Export the {{ report.title }} as a PDF file."
           class="flex flex-col items-center gap-1 px-2 py-3 text-center transition-colors hover:bg-emerald-50/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-emerald-500 dark:hover:bg-emerald-500/10">
            <svg class="h-5 w-5 text-gray-500 transition-colors group-hover:text-emerald-600 dark:text-gray-400 dark:group-hover:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9 13h6M9 16.5h4"></path></svg>
            <span class="text-xs font-semibold text-gray-700 dark:text-gray-200">Export PDF</span>
            <span class="text-[.62rem] text-gray-400 dark:text-gray-500">download file</span>
        </a>
        <a href="{{ report.excel_url }}"
           aria-label="Export the {{ report.title }} rows as an Excel spreadsheet."
           class="flex flex-col items-center gap-1 px-2 py-3 text-center transition-colors hover:bg-emerald-50/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-emerald-500 dark:hover:bg-emerald-500/10">
            <svg class="h-5 w-5 text-gray-500 transition-colors group-hover:text-emerald-600 dark:text-gray-400 dark:group-hover:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M3 10h18M3 6h18M3 14h18M3 18h18M7 6v12"></path></svg>
            <span class="text-xs font-semibold text-gray-700 dark:text-gray-200">Export Excel</span>
            <span class="text-[.62rem] text-gray-400 dark:text-gray-500">raw rows</span>
        </a>
    </div>
</article>
