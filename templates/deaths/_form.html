{% extends "partials/modal.html" %}
{% block modal_title %}{% if record %}Edit Record{% else %}Add Death Record{% endif %}{% endblock %}
{% block modal_content %}
<form hx-post="{% if record %}{% url 'deaths:death_update' record.pk %}{% else %}{% url 'deaths:death_create' %}{% endif %}" 
      hx-target="#modal-container" hx-swap="innerHTML" hx-target-4*="#modal-container" class="space-y-4">
    {% csrf_token %}
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Flock</label>
            <select name="flock" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 dark:bg-gray-700 dark:text-white transition-all" required>
                {% for flock in flocks %}
                <option value="{{ flock.pk }}" {% if form.flock.value|stringformat:'s' == flock.pk|stringformat:'s' %}selected{% endif %}>{{ flock.batch_number }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Date</label>
            <input type="date" name="date_recorded" value="{{ form.date_recorded.value|date:'Y-m-d'|default:'' }}" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 dark:bg-gray-700 dark:text-white transition-all" required>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Quantity</label>
            <input type="number" name="quantity" value="{{ form.quantity.value|default:'' }}" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 dark:bg-gray-700 dark:text-white transition-all" required>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Cause of Death</label>
            <input type="text" name="cause_of_death" value="{{ form.cause_of_death.value|default:'' }}" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 dark:bg-gray-700 dark:text-white transition-all">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Symptoms</label>
            <textarea name="symptoms" rows="2" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 dark:bg-gray-700 dark:text-white transition-all">{{ form.symptoms.value|default:'' }}</textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Action Taken</label>
            <textarea name="action_taken" rows="2" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 dark:bg-gray-700 dark:text-white transition-all">{{ form.action_taken.value|default:'' }}</textarea>
        </div>
        <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Remarks</label>
            <textarea name="remarks" rows="2" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 dark:bg-gray-700 dark:text-white transition-all">{{ form.remarks.value|default:'' }}</textarea>
        </div>
    </div>
    <div class="flex items-center justify-end space-x-3 pt-4 border-t border-gray-200 dark:border-gray-700">
        <button type="button" onclick="this.closest('#modal-overlay').remove()" class="px-5 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-xl transition-colors cursor-pointer">Cancel</button>
        <button type="submit" class="px-5 py-2.5 text-sm font-medium text-white bg-green-700 hover:bg-green-800 rounded-xl shadow-lg shadow-green-900/30 hover:shadow-xl transition-all duration-200 cursor-pointer">Save</button>
    </div>
</form>
{% endblock %}
