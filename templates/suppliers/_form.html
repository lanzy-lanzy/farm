{% extends "partials/modal.html" %}
{% block modal_title %}{% if supplier %}Edit Supplier{% else %}Add Supplier{% endif %}{% endblock %}
{% block modal_content %}
<form hx-post="{% if supplier %}{% url 'suppliers:supplier_update' supplier.pk %}{% else %}{% url 'suppliers:supplier_create' %}{% endif %}"
      hx-target="#modal-container" hx-swap="innerHTML" hx-target-4*="#modal-container" class="space-y-6">
    {% csrf_token %}
    <div>
        <p class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-emerald-700 dark:text-emerald-400 mb-3">
            <span class="w-5 h-5 rounded-md bg-emerald-100 dark:bg-emerald-900/40 grid place-items-center">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </span>
            Identity &amp; contact
        </p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Supplier Name <span class="text-red-500">*</span></label>
                <input type="text" name="name" value="{{ form.name.value|default:'' }}" placeholder="e.g. Zamboanga Feeds Supplier" class="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 rounded-xl text-sm text-gray-800 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-green-500 focus:border-green-500 focus:bg-white dark:focus:bg-gray-700 transition-all" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Contact Person</label>
                <input type="text" name="contact_person" value="{{ form.contact_person.value|default:'' }}" placeholder="Who to call" class="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 rounded-xl text-sm text-gray-800 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-green-500 focus:border-green-500 focus:bg-white dark:focus:bg-gray-700 transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Phone</label>
                <input type="text" name="phone" value="{{ form.phone.value|default:'' }}" placeholder="09xx xxx xxxx" class="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 rounded-xl text-sm text-gray-800 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-green-500 focus:border-green-500 focus:bg-white dark:focus:bg-gray-700 transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
                <input type="email" name="email" value="{{ form.email.value|default:'' }}" placeholder="supplier@example.com" class="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 rounded-xl text-sm text-gray-800 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-green-500 focus:border-green-500 focus:bg-white dark:focus:bg-gray-700 transition-all">
            </div>
        </div>
    </div>
    <div>
        <p class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-emerald-700 dark:text-emerald-400 mb-3">
            <span class="w-5 h-5 rounded-md bg-emerald-100 dark:bg-emerald-900/40 grid place-items-center">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            </span>
            Supply profile
        </p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Supplies</label>
                <input type="text" name="supplies" value="{{ form.supplies.value|default:'' }}" placeholder="e.g. Poultry Feeds, Vitamins" class="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 rounded-xl text-sm text-gray-800 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-green-500 focus:border-green-500 focus:bg-white dark:focus:bg-gray-700 transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Status</label>
                <label class="inline-flex items-center gap-3 cursor-pointer h-[42px]">
                    <input type="checkbox" name="is_active" {% if form.is_active.value %}checked{% endif %} class="peer sr-only">
                    <span class="w-11 h-6 bg-gray-200 dark:bg-gray-600 rounded-full relative shrink-0 transition-colors after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:w-5 after:h-5 after:bg-white after:rounded-full after:shadow after:transition-all peer-checked:bg-green-600 peer-checked:after:translate-x-5"></span>
                    <span class="text-sm text-gray-600 dark:text-gray-300 peer-checked:text-green-700 dark:peer-checked:text-green-400">Active</span>
                </label>
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Address</label>
                <textarea name="address" rows="2" placeholder="Street, municipality, province" class="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 rounded-xl text-sm text-gray-800 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-green-500 focus:border-green-500 focus:bg-white dark:focus:bg-gray-700 transition-all">{{ form.address.value|default:'' }}</textarea>
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Notes</label>
                <textarea name="notes" rows="2" placeholder="Payment habits, delivery days, reminders..." class="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 rounded-xl text-sm text-gray-800 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-green-500 focus:border-green-500 focus:bg-white dark:focus:bg-gray-700 transition-all">{{ form.notes.value|default:'' }}</textarea>
            </div>
        </div>
    </div>
    <div class="flex items-center justify-between pt-4 border-t border-gray-200 dark:border-gray-700">
        <p class="text-xs text-gray-400 dark:text-gray-500"><span class="text-red-500">*</span> Required field</p>
        <div class="flex items-center space-x-3">
            <button type="button" onclick="this.closest('#modal-overlay').remove()" class="px-5 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-xl transition-colors cursor-pointer">Cancel</button>
            <button type="submit" class="inline-flex items-center gap-2 px-5 py-2.5 text-sm font-medium text-white bg-green-700 hover:bg-green-800 rounded-xl shadow-lg shadow-green-900/30 hover:shadow-xl transition-all duration-200 cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                Save
            </button>
        </div>
    </div>
</form>
{% endblock %}
