{% extends "partials/modal.html" %}
{% block modal_title %}Delete Flock{% endblock %}
{% block modal_content %}
<div class="text-center py-4">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-red-100 dark:bg-red-900 rounded-full mb-4">
        <svg class="w-8 h-8 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
    </div>
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white mb-2">Confirm Deletion</h3>
    <p class="text-sm text-gray-500 dark:text-gray-400">Are you sure you want to delete flock <strong>{{ flock.batch_number }}</strong>? This action cannot be undone.</p>
</div>
<form hx-post="{% url 'flocks:flock_delete' flock.pk %}" hx-target="#modal-container" hx-swap="innerHTML" hx-target-4*="#modal-container" class="flex items-center justify-center space-x-3 pt-4 border-t border-gray-200 dark:border-gray-700">
    {% csrf_token %}
    <button type="button" onclick="this.closest('#modal-overlay').remove()" class="px-5 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-xl transition-colors cursor-pointer">Cancel</button>
    <button type="submit" class="px-5 py-2.5 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-xl shadow-lg transition-all duration-200 cursor-pointer">Yes, Delete</button>
</form>
{% endblock %}
