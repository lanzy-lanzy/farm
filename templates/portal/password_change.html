{% extends "portal/base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <h1 class="text-xl font-bold text-gray-800 dark:text-white mb-4">Change Password</h1>
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-6">
        <form method="post">
            {% csrf_token %}
            {% include "portal/_form_fields.html" %}
            <button type="submit" class="bg-green-700 hover:bg-green-800 text-white px-5 py-2.5 rounded-xl font-medium shadow-lg transition-colors">Change Password</button>
        </form>
    </div>
</div>
{% endblock %}
