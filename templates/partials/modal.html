<div id="modal-overlay" class="fixed inset-0 bg-black/50 dark:bg-black/70 z-50 flex items-center justify-center p-4" x-data="{ open: true }" x-show="open" x-cloak @keydown.escape.window="open = false; $el.remove()">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto" role="dialog" aria-modal="true" @click.away="open = false">
        <div class="sticky top-0 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-6 py-4 flex items-center justify-between rounded-t-2xl z-10">
            <h2 class="text-lg font-semibold text-gray-800 dark:text-white">{% block modal_title %}{% endblock %}</h2>
            <button onclick="this.closest('#modal-overlay').remove()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors cursor-pointer">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="p-6">
            {% block modal_content %}{% endblock %}
        </div>
    </div>
</div>
