{% extends "partials/modal.html" %}
{% block modal_title %}{% if record %}Edit Sale{% else %}Add Sale{% endif %}{% endblock %}
{% block modal_content %}
<form hx-post="{% if record %}{% url 'sales:sales_update' record.pk %}{% else %}{% url 'sales:sales_create' %}{% endif %}" 
      hx-target="#modal-container" hx-swap="innerHTML" hx-target-4*="#modal-container" class="space-y-4">
    {% csrf_token %}
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Product Type</label>
            <select name="product_type" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 dark:bg-gray-700 dark:text-white transition-all" required>
                <option value="eggs" {% if form.product_type.value == 'eggs' %}selected{% endif %}>Eggs</option>
                <option value="chicken" {% if form.product_type.value == 'chicken' %}selected{% endif %}>Live Chicken</option>
                <option value="dressed" {% if form.product_type.value == 'dressed' %}selected{% endif %}>Dressed Chicken</option>
                <option value="manure" {% if form.product_type.value == 'manure' %}selected{% endif %}>Manure</option>
                <option value="other" {% if form.product_type.value == 'other' %}selected{% endif %}>Other</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Product Name</label>
            <input type="text" name="product_name" value="{{ form.product_name.value|default:'' }}" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 dark:bg-gray-700 dark:text-white transition-all" required>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Flock (optional)</label>
            <select name="flock" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 dark:bg-gray-700 dark:text-white transition-all">
                <option value="">-- None --</option>
                {% for flock in flocks %}
                <option value="{{ flock.pk }}" {% if form.flock.value|stringformat:'s' == flock.pk|stringformat:'s' %}selected{% endif %}>{{ flock.batch_number }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Buyer (optional)</label>
            <select name="buyer" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 dark:bg-gray-700 dark:text-white transition-all">
                <option value="">-- None --</option>
                {% for buyer in buyers %}
                <option value="{{ buyer.pk }}" {% if form.buyer.value|stringformat:'s' == buyer.pk|stringformat:'s' %}selected{% endif %}>{{ buyer.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Quantity</label>
            <input type="number" name="quantity" value="{{ form.quantity.value|default:'' }}" step="0.01" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 dark:bg-gray-700 dark:text-white transition-all" required>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Unit Price</label>
            <input type="number" name="unit_price" value="{{ form.unit_price.value|default:'0' }}" step="0.01" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 dark:bg-gray-700 dark:text-white transition-all" required>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Date Sold</label>
            <input type="date" name="date_sold" value="{{ form.date_sold.value|date:'Y-m-d'|default:'' }}" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 dark:bg-gray-700 dark:text-white transition-all" required>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Payment Status</label>
            <select name="payment_status" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 dark:bg-gray-700 dark:text-white transition-all">
                <option value="paid" {% if form.payment_status.value == 'paid' %}selected{% endif %}>Paid</option>
                <option value="pending" {% if form.payment_status.value == 'pending' %}selected{% endif %}>Pending</option>
                <option value="partial" {% if form.payment_status.value == 'partial' %}selected{% endif %}>Partial</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Amount Paid</label>
            <input type="number" name="amount_paid" value="{{ form.amount_paid.value|default:'0' }}" step="0.01" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 dark:bg-gray-700 dark:text-white transition-all">
        </div>
        <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Notes</label>
            <textarea name="notes" rows="2" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 dark:bg-gray-700 dark:text-white transition-all">{{ form.notes.value|default:'' }}</textarea>
        </div>
    </div>
    <div class="flex items-center justify-end space-x-3 pt-4 border-t border-gray-200 dark:border-gray-700">
        <button type="button" onclick="this.closest('#modal-overlay').remove()" class="px-5 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-xl transition-colors cursor-pointer">Cancel</button>
        <button type="submit" class="px-5 py-2.5 text-sm font-medium text-white bg-green-700 hover:bg-green-800 rounded-xl shadow-lg shadow-green-900/30 hover:shadow-xl transition-all duration-200 cursor-pointer">Save</button>
    </div>
</form>
{% endblock %}
