{% extends "base.html" %}
{% block title %}Delete User{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 text-center space-y-4">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-red-100 dark:bg-red-900/40 rounded-full">
        <svg class="w-8 h-8 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
    </div>
    <h1 class="text-xl font-bold text-gray-800 dark:text-white">Confirm Deletion</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400">
        Delete user <strong>{{ target_user.get_full_name|default:target_user.username }}</strong> (@{{ target_user.username }})?
    </p>
    <form method="post" class="flex items-center justify-center gap-3 pt-2">
        {% csrf_token %}
        <a href="{% url 'accounts:user_list' %}" class="px-5 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 rounded-xl">Cancel</a>
        <button type="submit" class="px-5 py-2.5 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-xl">Yes, Delete</button>
    </form>
</div>
{% endblock %}
